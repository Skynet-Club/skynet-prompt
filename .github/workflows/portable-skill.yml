name: portable-skill

on:
  push:
    paths:
      - "data/**"
      - "scripts/build_skill.py"
      - "tests/**"
      - "skynet_prompt/**"
      - ".github/workflows/portable-skill.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install prompt_toolkit
      - name: Run tests
        run: python tests/run.py
      - name: Build portable skill
        run: python scripts/build_skill.py --out portable/skynet-prompt.skill
      - name: Inspect archive root
        run: python -c "import zipfile; z=zipfile.ZipFile('portable/skynet-prompt.skill'); names=z.namelist(); assert 'SKILL.md' in names; assert len([n for n in names if n.startswith('prompts/')])==69; print('portable skill ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-prompt-${{ matrix.os }}
          path: portable/skynet-prompt.skill
